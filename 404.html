<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#0b1120">
    <title>Página não encontrada - Insighter X</title>
    <link rel="icon" href="/simbolo.png" type="image/png">
    <link rel="apple-touch-icon" href="/simbolo.png">
    <link rel="stylesheet" href="assets/styles.css">
    <style>
      .not-found { min-height: calc(100vh - 78px); padding: 80px 28px; display: grid; place-items: center; color: #f6f8fb; background: #09111f; }
      .not-found__content { width: min(100%, 680px); }
      .not-found__content p { max-width: 500px; color: #aebaca; font-size: 17px; line-height: 1.7; }
      .not-found__code { margin-bottom: 18px; color: #53c6cb; font-size: 13px; font-weight: 700; letter-spacing: .08em; }
      .not-found h1 { margin: 0; font-size: clamp(52px, 7vw, 92px); font-weight: 560; letter-spacing: -.06em; line-height: .95; }
      .not-found h1 em { color: #53c6cb; font-style: normal; }
      .not-found .button { margin-top: 22px; color: #0b1120; background: #f4f7f8; }
    </style>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/" aria-label="Insighter X - início"><img src="assets/images/insighter-x-black.png" alt="Insighter X"></a>
      <a class="nav-cta" href="/">Voltar ao início <span>→</span></a>
    </header>
    <main class="not-found">
      <div class="not-found__content">
        <p class="not-found__code">ERRO 404</p>
        <h1>Essa página não foi <em>encontrada.</em></h1>
        <p>O endereço pode ter mudado ou não existir mais. Vamos te levar de volta para a Insighter X.</p>
        <a class="button" href="/">Ir para o início <span>→</span></a>
      </div>
    </main>
  </body>
</html>
